<!--
  纯静态原型：无构建、无 npm、无外部依赖。
  直接双击本文件即可在浏览器中打开（file:// 协议），也可放到任意静态服务器。

  注意（沿用既有原型的两条约束）：
    1. 使用「经典 script + 全局命名空间」而不是 ES modules ——
       Chrome 在 file:// 下会以 CORS 为由拒绝加载 type="module"。
    2. 不引任何 CDN / UI 框架 / 图标字体 —— 内网与信创环境下外链不可靠，
       图标一律内联 SVG，图表手写 SVG。
-->
